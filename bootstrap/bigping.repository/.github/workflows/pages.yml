# Deploys the BigPing Kodi repository to GitHub Pages.
#
# This file belongs to maratdob118/bigping.repository. It is bootstrapped there
# by hand, once, together with scripts/build_site.py — see bootstrap/README.md
# in maratdob118/bigping. It is deliberately NOT written by the release
# publisher: keeping `.github/` out of the published tree is what lets the
# cross-repository token hold Contents:write alone, with no `workflows`
# permission and no classic PAT.
#
# The release publisher pushes text only (addons.xml, addons.xml.md5,
# manifest.json, repository.bigping/addon.xml). That push runs this workflow,
# which downloads the ~235 MB universal payload from the source repository's
# release, proves it is byte-for-byte the artifact the manifest measured, and
# serves it under the canonical Kodi path. Nothing binary is ever committed.
name: Deploy Kodi repository to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time, and never cancel one halfway: a partially replaced
# site would answer addons.xml with a ZIP that is not there yet.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The repository's own GITHUB_TOKEN, nothing else: id-token mints the
    # Pages deployment's OIDC credential. The source repo's PAT never gets here.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read the download plan from manifest.json
        id: plan
        run: python3 scripts/build_site.py --plan --manifest manifest.json >> "$GITHUB_OUTPUT"

      # The URL is validated by --plan (it must be this version's asset in the
      # source repo's release) and reaches curl through the environment, never
      # interpolated into the script.
      - name: Download the universal payload from the source release
        env:
          PAYLOAD_URL: ${{ steps.plan.outputs.url }}
        run: |
          curl --fail --location --show-error --silent \
               --retry 5 --retry-delay 5 --retry-all-errors \
               --output payload.zip -- "$PAYLOAD_URL"

      - name: Verify the payload byte for byte
        run: python3 scripts/build_site.py --verify --manifest manifest.json --payload payload.zip

      - name: Build the site
        run: python3 scripts/build_site.py --manifest manifest.json --payload payload.zip --out _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
